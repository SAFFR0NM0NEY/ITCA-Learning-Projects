<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Your Cart</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main id="cart-items">
        <!-- Cart content will be loaded by script -->
    </main>

    <footer>
        <p>&copy; 2025 Joy D Drip</p>
    </footer>

    <script>
        // Load the cart from localStorage
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const cartContainer = document.getElementById("cart-items");

        // If cart is empty, show a message
        if (cart.length === 0) {
            cartContainer.innerHTML = "<p>Your cart is empty.</p>";
        } else {
            let html = "<h2>Your Cart</h2>";
            let total = 0;

            // Loop through the cart and display items
            cart.forEach((item, index) => {
                const price = parseFloat(item.price).toFixed(2);
                const subtotal = item.price * item.quantity;
                total += subtotal;

                html += `
                    <div class="cart-item">
                        <p>${item.name} - R${price} x ${item.quantity}</p>
                        <label for="quantity-${index}">Quantity:</label>
                        <input type="number" id="quantity-${index}" value="${item.quantity}" min="1" max="10" onchange="updateQuantity(${index})">
                        <button onclick="removeItem(${index})">Remove</button>
                        <p>Subtotal: R${subtotal.toFixed(2)}</p>
                    </div>
                `;
            });

            // Display the total price
            html += `<h3>Total: R${total.toFixed(2)}</h3>`;
            cartContainer.innerHTML = html;
        }

        // Update the quantity in localStorage
        function updateQuantity(index) {
            const newQuantity = document.getElementById(`quantity-${index}`).value;
            if (newQuantity < 1) return; // Prevent invalid quantities
            cart[index].quantity = parseInt(newQuantity);
            localStorage.setItem("cart", JSON.stringify(cart));
            window.location.reload();  // Refresh the page to show updated cart
        }

        // Remove item from cart
        function removeItem(index) {
            cart.splice(index, 1);  // Remove the item from the cart array
            localStorage.setItem("cart", JSON.stringify(cart));
            window.location.reload();  // Refresh the page to show updated cart
        }
    </script>
</body>
</html>
