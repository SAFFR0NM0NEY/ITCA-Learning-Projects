<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JOY D BOY</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Welcome to Joy D Boy</h1>
    <nav>

        <div class="product">

  <footer>
    <p>&copy; 2025 Joy D Boy</p>
