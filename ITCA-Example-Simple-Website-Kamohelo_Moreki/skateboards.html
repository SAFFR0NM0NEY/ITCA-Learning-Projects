<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skateboards Collection</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/cart.js"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous"
  />
</head>
<body>
  <header>
    <h1>Explore Our Skateboards</h1>
    <nav>
      <a href="index.html" class="btn home-btn">Home</a>
      <a href="product menue.html" class="btn Product-btn">Product menue</a>
      <a href="cart.html" class="btn cart-btn" aria-label="Shopping Cart">
        <i class="fas fa-shopping-cart"></i>
      </a>
    </nav>
  </header>

  <main class="products-container">
    <div class="product-card" data-id="1">
      <img src="images\Skateboards\S1.jpg" alt="Classic Skateboard" />
      <h2>Classic Skateboard</h2>
      <p>R1,799</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="2">
      <img src="images\Skateboards\S2.jpg" alt="Pro Deck Skateboard" />
      <h2>Pro Deck Skateboard</h2>
      <p>R2,299</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="3">
      <img src="images\Skateboards\S3.jpg" alt="Cruiser Skateboard" />
      <h2>Cruiser Skateboard</h2>
      <p>R1,999</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="4">
      <img src="images\Skateboards\S4.jpg" alt="Electric Skateboard" />
      <h2>Electric Skateboard</h2>
      <p>R5,499</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>
  </main>

  
</body>
</html>
