<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmed</title>
  <link rel="stylesheet" href="css/style.css"> 
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .thank-you {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.15);
      max-width: 700px;
      width: 90%;
    }

    .thank-you h1 {
      font-size: 2.5rem;
      color: #00ffaa;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #00ffaa88;
    }

    .thank-you p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 2rem;
    }

    .thank-you img {
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.2);
      margin-bottom: 2rem;
    }

    .thank-you .btn {
      background-color: #00ffaa;
      color: #000;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .thank-you .btn:hover {
      background-color: #00cc88;
    }
  </style>
</head>
<body>
  <div class="thank-you">
    <h1>🎉 Thank You for Your Purchase!</h1>
    <p>Your order has been successfully placed. We hope you enjoy your products!</p>
    <img src="images\Big THANK YOU! To everyone who has made a purchase….jpg" alt="Thank You" />

    <a href="homepage.html" class="btn">Return to Homepage</a>
  </div>
</body>
</html>
