<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formal Suits</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/cart.js"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous"
  />
</head>
<body>
  <header>
    <h1>Explore Our Premium Formal Suits</h1>
    <nav>
      <a href="index.html" class="btn home-btn">Home</a>
      <a href="product menue.html" class="btn Product-btn">Product menue</a>
      <a href="cart.html" class="btn cart-btn" aria-label="Shopping Cart">
        <i class="fas fa-shopping-cart"></i>
      </a>
    </nav>
  </header>

  <main class="products-container">
    <div class="product-card" data-id="1">
      <img src="images/S1.jpg" alt="Black Executive Suit" />
      <h2>Black Executive Suit</h2>
      <p>R2,999</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="2">
      <img src="images/S2.jpg" alt="Classic Navy Suit" />
      <h2>Classic Navy Suit</h2>
      <p>R3,499</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="3">
      <img src="images/S3.jpg" alt="Grey Modern Fit" />
      <h2>Grey Modern Fit</h2>
      <p>R3,199</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="4">
      <img src="images/S4.jpg" alt="Charcoal Premium Suit" />
      <h2>Charcoal Premium Suit</h2>
      <p>R3,599</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="5">
      <img src="images/S5.jpg" alt="Double Breasted Royal" />
      <h2>Double Breasted Royal</h2>
      <p>R3,999</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card" data-id="6">
      <img src="images/S6.jpg" alt="White Luxury Tux" />
      <h2>White Luxury Tux</h2>
      <p>R4,499</p>
      <button class="btn add-to-cart">Add to Cart</button>
    </div>
  </main>

  
</body>
</html>
